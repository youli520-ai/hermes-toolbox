name: env-reminder
version: "0.4.2"
description: 环境便签——pre_llm_call 钩子（0.3.0 由 pre_gateway_dispatch 迁移而来），agent 每轮检测到环境变化时把便签注入当轮用户消息的 API 副本（不碰 system prompt、不污染会话历史）；全入口覆盖（TUI/桌面/6060 API/飞书/微信/A2A），因为所有入口共用同一条 agent 循环；白名单按 platform + sender_id + session_id 判定（本机入口放行、网关平台需 sender 命中且 dm）；子代理轮次跳过；异常 fail-open
